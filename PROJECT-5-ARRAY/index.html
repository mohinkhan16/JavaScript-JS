<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Array Project</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  
<div class="container py-5">
  <div class="card shadow-lg">
    
    <div class="card-body text-center">
      <h2 class="mb-4 text-primary">Array Project</h2>

      <div class="row justify-content-center mb-3">
        <div class="col-md-4">
          <input type="number" id="arrayNum" class="form-control" placeholder="Enter array size">
        </div>
        <div class="col-auto">
          <button class="btn btn-primary" onclick="startNum()">Start</button>
        </div>
      </div>

      <div id="itemArray" class="d-flex flex-wrap justify-content-center gap-2 mb-3"></div>

      <button class="btn btn-outline-primary mb-2" id="showArray">Create Array</button>
      <p id="createArray" class="fw-bold text-success"></p>

      <div class="d-flex flex-wrap justify-content-center gap-2 mb-3">

        <input type="text" id="pushInput" class="form-control w-auto" placeholder="Value" style="display:none;">
        <button id="addBtn" class="btn btn-success" style="display:none;">Add</button>
       <button class="btn btn-primary" onclick="startNum()">Start</button>
        <button class="btn btn-danger" onclick="Push()">Push</button>
        <button class="btn btn-dark" onclick="Pop()">Pop</button>
        <button class="btn btn-warning" onclick="Shift()">Shift</button>
        <button class="btn btn-primary" onclick="Unshift()">Unshift</button>
        <button class="btn btn-info" onclick="Join()">Join</button>
        <button class="btn btn-secondary" onclick="Reverse()">Reverse</button>
        <button class="btn btn-dark" onclick="Sort()">Sort</button>
        <button class="btn btn-warning" onclick="find()">Find</button>
        <button class="btn btn-info" onclick="Ascending()">Ascending</button>
        <button class="btn btn-success" onclick="Descending()">Descending</button>
             <button class="btn btn-secondary" onclick="length()">Length</button>
              <button class="btn btn-danger" onclick="Map()">Map</button>
                 <button class="btn btn-danger" onclick="Reduce()">Reduce</button>
                 <button class="btn btn-danger" onclick="Filter()">Filter</button>
              <button class="btn btn-danger" onclick="Clear()">Clear</button>

      </div>

      <div class="alert alert-light border">
        <h5>Output:</h5>
        <p id="output" class="fw-bold"></p>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
