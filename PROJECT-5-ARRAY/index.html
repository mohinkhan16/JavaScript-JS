<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Array Project</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  
<div class="container py-5">
  <div class="card shadow-lg">
    
    <div class="card-body text-center">
      <h2 class="mb-4 text-primary">Array Project</h2>

      <div class="row justify-content-center mb-3">
        <div class="col-md-4">
          <input type="number" id="arrayNum" class="form-control" placeholder="Enter array size">
        </div>
        <div class="col-auto">
          <button class="btn btn-primary" onclick="startNum()">Start</button>
        </div>
      </div>

      <div id="itemArray" class="d-flex flex-wrap justify-content-center gap-2 mb-3"></div>

      <button class="btn btn-outline-primary mb-2" id="showArray">Create Array</button>
      <p id="createArray" class="fw-bold text-success"></p>

      <div class="d-flex flex-wrap justify-content-center gap-2 mb-3">

        <input type="text" id="pushInput" class="form-control w-auto" placeholder="Value" style="display:none;">
        <button id="addBtn" class="btn btn-success" style="display:none;">Add</button>
        <button class="btn btn-primary" id="pushBtn">Push</button>

        <button class="btn btn-warning" id="popBtn">Pop</button>
        <button class="btn btn-warning" id="shiftBtn">Shift</button>

        <input type="text" id="unshiftInput" class="form-control w-auto" placeholder="Value" style="display:none;">
        <button id="unshiftAddBtn" class="btn btn-success" style="display:none;">Add First</button>
        <button class="btn btn-primary" id="unshiftBtn">Unshift</button>

        <button class="btn btn-info" id="jointBtn">Join</button>
        <button class="btn btn-secondary" id="reverseBtn">Reverse</button>
        <button class="btn btn-dark" id="sortBtn">Sort</button>
        <button class="btn btn-danger" id="clearBtn">Clear</button>
      </div>

      <div class="row justify-content-center mb-3">
        <div class="col-md-4">
          <input type="text" id="searchInput" class="form-control" placeholder="Search value">
        </div>
        <div class="col-auto">
          <button class="btn btn-secondary" id="searchBtn">Search</button>
        </div>
      </div>

      <div class="alert alert-light border">
        <h5>Output:</h5>
        <p id="output" class="fw-bold"></p>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
